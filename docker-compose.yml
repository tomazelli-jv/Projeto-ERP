services:
  mariadb:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-tomazelli_erp}
      MARIADB_USER: ${DB_USER:-tomazelli}
      MARIADB_PASSWORD: ${DB_PASSWORD:-tomazelli_local}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_local_only}
      TZ: UTC
    ports:
      - '${DB_PORT:-3306}:3306'
    volumes:
      - mariadb_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mariadb_data:
