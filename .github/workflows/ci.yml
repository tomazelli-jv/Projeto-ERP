name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_DATABASE: tomazelli_erp_test
          MARIADB_USER: tomazelli
          MARIADB_PASSWORD: test_password
          MARIADB_ROOT_PASSWORD: test_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: tomazelli_erp_test
      DB_USER: tomazelli
      DB_PASSWORD: test_password
      DB_INTEGRATION_TESTS: true
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run db:migrate
      - run: npm run db:status
      - name: Validate migration rollback and reapply
        run: npm run db:rollback && npm run db:migrate
      - run: npm run test:coverage
      - run: npm run build
      - run: npm audit --audit-level=high
      - name: Ensure development seeds are blocked
        run: npm run db:seed && exit 1 || exit 0
