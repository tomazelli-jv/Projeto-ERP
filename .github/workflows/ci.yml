name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_DATABASE: tomazelli_erp_test
          MARIADB_USER: tomazelli
          MARIADB_PASSWORD: test_password
          MARIADB_ROOT_PASSWORD: test_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: tomazelli_erp_test
      DB_USER: tomazelli
      DB_PASSWORD: test_password
      DB_INTEGRATION_TESTS: true
      ConnectionStrings__MariaDb: Server=127.0.0.1;Port=3306;Database=tomazelli_erp_test;User ID=tomazelli;Password=test_password
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: npm ci --workspaces --include-workspace-root
      - run: npm run format:check
      - run: npm run lint
      - name: Restore .NET backend
        run: dotnet restore backend/ERP.sln --configfile NuGet.Config
      - name: Build .NET backend
        run: dotnet build backend/ERP.sln --configuration Release --no-restore
      - name: Verify .NET formatting
        run: dotnet format backend/ERP.sln --verify-no-changes --no-restore
      - name: Audit NuGet dependencies
        run: dotnet list backend/ERP.sln package --vulnerable --include-transitive
      - name: Validate .NET migrations on an empty database
        run: |
          dotnet run --project backend/src/ERP.Migrations --configuration Release --no-build -- up
          dotnet run --project backend/src/ERP.Migrations --configuration Release --no-build -- status
          dotnet run --project backend/src/ERP.Migrations --configuration Release --no-build -- down
          dotnet run --project backend/src/ERP.Migrations --configuration Release --no-build -- up
      - name: Test ASP.NET backend with MariaDB
        run: dotnet test backend/ERP.sln --configuration Release --no-build --collect:"XPlat Code Coverage"
      - name: Build React frontend
        run: npm run build --workspace=@tomazelli/web
      - run: npm audit --audit-level=high
      - name: Ensure development seeds are blocked
        run: npm run db:seed && exit 1 || exit 0
