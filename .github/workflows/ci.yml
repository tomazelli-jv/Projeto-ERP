name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    # Este repositório agora valida somente o frontend.
    # O backend oficial .NET 8 possui repositório e pipeline próprios.
    env:
      NODE_ENV: test

    steps:
      # Recupera o código da branch/PR que está sendo validado.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Mantém a mesma versão de Node utilizada pelo projeto no CI.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Instala as dependências respeitando o lockfile e os workspaces.
      - name: Install dependencies
        run: npm ci --workspaces --include-workspace-root

      # Valida formatação antes do lint/build para evitar código inconsistente.
      - name: Check formatting
        run: npm run format:check

      # Executa as regras estáticas do frontend.
      - name: Lint
        run: npm run lint

      # Faz uma verificação simples contra formatos comuns de segredos
      # acidentalmente versionados no repositório.
      - name: Scan tracked files for common secret formats
        shell: bash
        run: |
          pattern='BE''GIN (RSA |EC |OPENSSH )?PRIVATE KEY|AK''IA[0-9A-Z]{16}|github_''pat_|gh''p_[A-Za-z0-9]{20,}|s''k-[A-Za-z0-9]{20,}'
          if git grep -n -I -E "$pattern" -- ':!package-lock.json'; then
            echo 'Potential secret detected'
            exit 1
          fi

      # Garante que o React/Vite continua gerando um build de produção válido.
      - name: Build React frontend
        run: npm run build --workspace=@tomazelli/web

      # Falha o CI somente para vulnerabilidades npm classificadas como high ou critical.
      - name: Audit npm dependencies
        run: npm audit --audit-level=high