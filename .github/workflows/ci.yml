name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_DATABASE: tomazelli_erp_test
          MARIADB_USER: tomazelli
          MARIADB_PASSWORD: test_password
          MARIADB_ROOT_PASSWORD: test_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: tomazelli_erp_test
      DB_USER: tomazelli
      DB_PASSWORD: test_password
      DB_INTEGRATION_TESTS: true
      ConnectionStrings__MariaDb: Server=127.0.0.1;Port=3306;Database=tomazelli_erp_test;User ID=tomazelli;Password=test_password
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: npm ci --workspaces --include-workspace-root
      - run: npm run format:check
      - run: npm run lint
      - name: Restore .NET backend
        run: dotnet restore backend/ERP.sln --configfile NuGet.Config
      - name: Build .NET backend
        run: dotnet build backend/ERP.sln --configuration Release --no-restore
      - name: Verify .NET formatting
        run: dotnet format backend/ERP.sln --verify-no-changes --no-restore
      - name: Audit NuGet dependencies
        run: dotnet list backend/ERP.sln package --vulnerable --include-transitive
      - name: Scan tracked files for common secret formats
        shell: bash
        run: |
          pattern='BE''GIN (RSA |EC |OPENSSH )?PRIVATE KEY|AK''IA[0-9A-Z]{16}|github_''pat_|gh''p_[A-Za-z0-9]{20,}|s''k-[A-Za-z0-9]{20,}'
          if git grep -n -I -E "$pattern" -- ':!package-lock.json'; then
            echo 'Potential secret detected'
            exit 1
          fi
      - name: Validate .NET migrations on an empty database
        run: |
          dotnet run --project backend/src/ERP.Migrations --configuration Release --no-build -- up
          dotnet run --project backend/src/ERP.Migrations --configuration Release --no-build -- status
          dotnet run --project backend/src/ERP.Migrations --configuration Release --no-build -- down
          dotnet run --project backend/src/ERP.Migrations --configuration Release --no-build -- up
      - name: Test ASP.NET backend with MariaDB
        run: dotnet test backend/ERP.sln --configuration Release --no-build --collect:"XPlat Code Coverage" --filter "FullyQualifiedName!~AuthenticationFlowTests"
      - name: Test authentication HTTP validation with MariaDB
        run: dotnet test backend/tests/ERP.IntegrationTests/ERP.IntegrationTests.csproj --configuration Release --no-build --filter "FullyQualifiedName~AuthenticationFlowTests.InvalidLogin|FullyQualifiedName~AuthenticationFlowTests.CookieEndpoints"
      - name: Test authentication sessions and refresh concurrency with MariaDB
        shell: bash
        run: |
          set +e
          dotnet test backend/tests/ERP.IntegrationTests/ERP.IntegrationTests.csproj --configuration Release --no-build --filter "FullyQualifiedName~AuthenticationFlowTests.LoginRefreshMeSessionsLogoutAndReuse" > auth-test.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            stage=$(grep -o 'AUTH_STAGE_[A-Z_]*' auth-test.log | head -n 1)
            echo "::error title=Authentication integration stage failed::${stage:-AUTH_STAGE_UNEXPECTED}"
          fi
          exit "$status"
      - name: Build React frontend
        run: npm run build --workspace=@tomazelli/web
      - run: npm audit --audit-level=high
      - name: Ensure development seeds are blocked
        run: npm run db:seed && exit 1 || exit 0
